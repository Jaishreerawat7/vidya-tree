<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vidya Tree">
<meta name="theme-color" content="#F3F7F2">
<meta name="description" content="Vidya Tree: a friendly learning app with Chiku the owl. Maths, Science, English, Hindi, Sanskrit and Rig Veda.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
html.is-app body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html.is-app .btn,html.is-app .tab,html.is-app .lp-opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.app-banner span{flex:1 1 260px}
.install-hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:100;display:flex;gap:14px;align-items:center;max-width:min(560px,calc(100vw - 32px));padding:14px 16px;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.18);border:1px solid var(--line)}
.ask-claude{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ask-claude .ac-owl{width:34px;height:34px;display:block;margin:-6px 0}.ask-claude .ac-owl svg{width:34px;height:34px}
.ask-claude.off{opacity:.55}
.lp-top .ask-claude{flex:none;padding:8px 14px}
@media (max-width:600px){.lp-top .ask-claude span:last-child{display:none}}
.install-hint p{margin-top:4px;font-size:16px}
</style>
</head>
<body>
<title>Vidya Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F7F2; --surface:#FFFFFF; --surface-2:#E7F0E6; --ink:#17231C; --muted:#56675B; --line:#D2DECE;
  --leaf:#2E7D4F; --leaf-soft:#D9EEDF; --marigold:#C98210; --marigold-soft:#FBEBCB; --sky:#2B77B8; --sky-soft:#D8E8F6;
  --berry:#B83E64; --berry-soft:#F6DCE4; --plum:#7650B3; --plum-soft:#E7DEF5; --saffron:#C45A17; --saffron-soft:#F8E0CF;
  --good:#2E7D4F; --bad:#B8403A; --bad-soft:#F7DEDC; --star:#F2A900; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(23,35,28,.06),0 8px 24px rgba(23,35,28,.08);
  --display:"Baloo 2","Mukta",system-ui,sans-serif; --body:"Mukta","Baloo 2",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1612; --surface:#17211B; --surface-2:#1F2C24; --ink:#E5EEE7; --muted:#9CB0A2; --line:#2C3B31;
    --leaf:#62C48F; --leaf-soft:#1D3827; --marigold:#F0B54B; --marigold-soft:#3A2E16; --sky:#6FB0EA; --sky-soft:#17304A;
    --berry:#E6829F; --berry-soft:#3D1D28; --plum:#B597E8; --plum-soft:#2D2242; --saffron:#F28E4C; --saffron-soft:#3E2415;
    --good:#62C48F; --bad:#EE7A73; --bad-soft:#3E1D1B; --star:#FFC940; --on-accent:#0F1612;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1612; --surface:#17211B; --surface-2:#1F2C24; --ink:#E5EEE7; --muted:#9CB0A2; --line:#2C3B31;
  --leaf:#62C48F; --leaf-soft:#1D3827; --marigold:#F0B54B; --marigold-soft:#3A2E16; --sky:#6FB0EA; --sky-soft:#17304A;
  --berry:#E6829F; --berry-soft:#3D1D28; --plum:#B597E8; --plum-soft:#2D2242; --saffron:#F28E4C; --saffron-soft:#3E2415;
  --good:#62C48F; --bad:#EE7A73; --bad-soft:#3E1D1B; --star:#FFC940; --on-accent:#0F1612;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 4px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:24px;margin-right:auto}
.ctl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.starpill{display:flex;align-items:center;gap:6px;background:var(--marigold-soft);color:var(--ink);border-radius:999px;padding:4px 12px 4px 8px;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.starpill svg{width:22px;height:22px}
select,input[type=text],input[type=number],input[type=password],textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;min-height:40px;max-width:100%}
textarea{resize:vertical}
.btn{border:0;border-radius:999px;padding:8px 18px;min-height:42px;font-weight:700;background:var(--leaf);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--marigold)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:34px;padding:5px 12px;font-size:15px}
.btn.big{min-height:52px;padding:10px 26px;font-size:19px;font-family:var(--display)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px 7px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);border-bottom:4px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--marigold)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
.note{font-size:14px;color:var(--muted)}
.banner{background:var(--marigold-soft);border-radius:14px;padding:10px 14px;font-size:15px;margin-bottom:14px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.sec-title h2{font-size:24px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;min-height:34px}
.chip:hover{border-color:var(--leaf)}
.chip[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

/* subject colours */
.s-maths{--c:var(--sky);--c-soft:var(--sky-soft)} .s-science{--c:var(--leaf);--c-soft:var(--leaf-soft)} .s-english{--c:var(--berry);--c-soft:var(--berry-soft)}
.s-hindi{--c:var(--marigold);--c-soft:var(--marigold-soft)} .s-sanskrit{--c:var(--plum);--c-soft:var(--plum-soft)} .s-rigveda{--c:var(--saffron);--c-soft:var(--saffron-soft)}
.subjects{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.subj{flex:none;display:flex;align-items:center;gap:10px;border:2px solid transparent;background:var(--surface);border-radius:16px;padding:6px 14px 6px 6px;font-weight:700;box-shadow:var(--shadow)}
.glyph{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--c-soft);color:var(--c);flex:none}
.subj[aria-pressed="true"]{border-color:var(--c)}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--leaf-soft),var(--sky-soft));border-radius:26px;padding:20px}
.hero h1{font-size:34px}
.hero .owl{width:120px;height:120px}
.jar{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.jar .stat{background:var(--surface);border-radius:16px;padding:8px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}
.tcard{text-align:left;border:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:6px;border-top:6px solid var(--c)}
.tcard .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.tcard h3{font-size:22px}
.tcard p{font-size:15px;color:var(--muted)}
.photo-day{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center}
.photo-day img{width:100%;border-radius:18px;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.games-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.gcard{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-align:left;background:var(--surface)}
.gcard canvas{display:block;width:100%;height:130px}
.gcard .gi{padding:10px 14px 14px}
.gcard h3{font-size:20px}
.gcard p{font-size:14px;color:var(--muted)}
.cost{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}

/* path */
.path{display:grid;gap:12px;margin-top:8px;position:relative}
.step{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 16px;text-align:left;border:2px solid transparent;width:100%}
.step:hover{border-color:var(--c)}
.step .num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:var(--c-soft);color:var(--c);position:relative}
.step.done .num{background:var(--c);color:var(--on-accent)}
.step.next{border-color:var(--c)}
.step h3{font-size:20px}
.step p{font-size:14px;color:var(--muted)}
.stars{display:flex;gap:2px}
.stars svg{width:22px;height:22px}
.path-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.meter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:160px;flex:1;max-width:320px}
.meter i{display:block;height:100%;background:var(--c,var(--leaf));border-radius:999px}

/* lesson */
.lesson{display:grid;gap:16px}
.lesson-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lesson-head h2{font-size:30px}
.goal{background:var(--c-soft);color:var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
.lcols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:980px){.lcols{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.rich p{margin:0 0 .6em}.rich p:last-child{margin-bottom:0}
.rich ul,.rich ol{margin:.2em 0 .7em;padding-left:1.3em}
.rich h4{font-size:21px;margin:.5em 0 .25em;color:var(--c,var(--ink))}
.rich code{background:var(--surface-2);padding:0 5px;border-radius:6px}
.fig{background:var(--surface-2);border-radius:16px;padding:8px;margin:.4em 0 .8em}
.fig svg{width:100%;height:auto;max-height:360px;display:block}
.fig.wait{color:var(--muted);font-size:14px;padding:14px}
.curtag{display:inline-block;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px;margin-top:6px}
.thinking{color:var(--muted);font-style:italic}
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.ph{flex:none;width:180px;border:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-align:left}
.ph img{display:block;width:100%;height:120px;object-fit:cover}
.ph span{display:block;padding:6px 10px;font-size:14px;font-weight:700}
.ph small{display:block;padding:0 10px 8px;font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap}

/* board */
.board{display:grid;gap:8px}
.board-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.board canvas{width:100%;display:block;border-radius:18px;background:#FFFDF8;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 0 1.5px var(--line)}
.board .sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.fb{border-radius:16px;padding:12px 16px;background:var(--surface-2)}
.fb strong{font-family:var(--display);font-size:20px}

/* chat */
.chatbox{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:520px}
.chat{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:64vh}
.msg{max-width:88%;display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end}
.msg.me .bubble{background:var(--sky-soft);border-radius:18px 18px 4px 18px}
.msg.ai .bubble{background:var(--surface-2);border-radius:18px 18px 18px 4px}
.msg.ai .bubble .fig{background:var(--surface)}
.bubble{padding:12px 16px;overflow-wrap:anywhere}
.bubble img.sent{max-width:220px;border-radius:12px;display:block;margin-top:6px}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.quick .chip{white-space:nowrap}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row textarea{flex:1;min-width:0;min-height:48px;max-height:160px}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:8px;margin-top:12px}
.starter{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-weight:600;font-size:15px}

/* explore */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px;margin:14px 0 20px}
.sim-card{text-align:left;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.sim-card[aria-pressed="true"]{border-color:var(--c)}
.sim-card .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.sim-card h3{font-size:20px}
.sim-card p{font-size:15px;color:var(--muted)}
.stage{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px}
.stage>*{min-width:0}
.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline}
.stage-head h2{font-size:26px}
.stage canvas{width:100%;border-radius:16px;background:var(--surface-2);touch-action:none;display:block}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.controls label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
input[type=range]{accent-color:var(--leaf);width:160px}
.readout{font-family:var(--display);font-size:22px;font-weight:700}
.explain{background:var(--surface-2);border-radius:14px;padding:12px 16px;font-size:16px}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.letters button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-family:var(--display)}
.letters button[aria-pressed="true"]{border-color:var(--marigold);background:var(--marigold-soft)}
.verse{font-size:22px;line-height:1.6;font-weight:600}
.anim-out{background:var(--surface-2);border-radius:16px;padding:10px;min-height:120px;display:grid;place-items:center}
.anim-out svg{width:100%;height:auto;max-height:420px}

/* games */
.arena{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#0b1a2a}
.arena canvas{display:block;width:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .q{background:rgba(255,255,255,.94);color:#17231C;border-radius:18px;padding:8px 18px;font-family:var(--display);font-weight:800;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hud .sc{background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,18,28,.55);padding:16px}
.over .panel{background:var(--surface);color:var(--ink);border-radius:24px;padding:22px;max-width:440px;width:100%;display:grid;gap:12px;text-align:center;justify-items:center}
.over h3{font-size:30px}
.choices{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap}
.choices button{min-width:84px;min-height:64px;border-radius:18px;border:0;background:rgba(255,255,255,.95);color:#17231C;font-family:var(--display);font-weight:800;font-size:30px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.choices button:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mm{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(130px,30%),1fr));gap:10px;perspective:900px}
.mcard{aspect-ratio:3/4;border:0;padding:0;background:none;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.mcard.up,.mcard.ok{transform:rotateY(180deg)}
.mface{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:var(--shadow)}
.mback{background:radial-gradient(circle at 30% 25%,#3E8E63,#1D4F37);display:grid;place-items:center}
.mfront{transform:rotateY(180deg);background:var(--surface);display:flex;flex-direction:column}
.mfront img{width:100%;flex:1;min-height:0;object-fit:cover;background:#000}
.mfront span{padding:4px 6px;font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.mcard.ok .mfront{box-shadow:0 0 0 4px var(--star),var(--shadow)}

/* quiz */
.qcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px;display:grid;gap:14px}
.qcard>*{min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--marigold)}
.qtext{font-family:var(--display);font-size:25px;font-weight:700;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:15px}
.opt.right{border-color:var(--good);background:var(--leaf-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score-big{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}

/* grown-ups */
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.panel{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:21px}
.who{display:flex;gap:14px;align-items:center}
.avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;background:var(--marigold-soft);color:var(--marigold);flex:none}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:92px 1fr 48px;gap:10px;align-items:center;font-size:15px;font-weight:600}
.bar .track{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:var(--c)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:7px;font-size:15px}
.list li:last-child{border-bottom:0}
.pill{border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;background:var(--c-soft,var(--surface-2));color:var(--c,var(--ink));white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,45%),1fr));gap:10px}
.gallery figure{margin:0;background:var(--surface-2);border-radius:14px;overflow:hidden}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff;cursor:zoom-in}
.gallery figcaption{padding:6px 8px;font-size:13px}
.report{background:var(--surface-2);border-radius:16px;padding:14px 18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{color:var(--ink);font-weight:400;font-size:16px}

/* modal + lightbox */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:22px;padding:20px;width:min(680px,100%);max-height:90vh;overflow-y:auto;display:grid;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--ink)}
.modal-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;background:rgba(5,10,8,.9);z-index:60;display:grid;grid-template-rows:1fr auto;padding:16px;gap:10px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;border-radius:12px;min-height:0}
.lightbox .cap{color:#fff;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;max-width:1000px;margin:0 auto;width:100%}
.lightbox .cap b{font-family:var(--display);font-size:22px}
.lightbox .cap small{opacity:.75}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:70;max-width:calc(100% - 32px);text-align:center}
.burst{position:fixed;inset:0;pointer-events:none;z-index:65}


/* live owl */
.owl-live{width:120px;height:120px;overflow:visible;display:block}
.owl-live .ow-lid{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.owl-live .ow-jaw{transform-box:fill-box;transform-origin:50% 0}
.owl-live.talking .ow-jaw{animation:jaw .16s infinite alternate}
@keyframes jaw{from{transform:scaleY(.2)}to{transform:scaleY(1.5)}}
.owl-live.talking{animation:nod 1.2s infinite ease-in-out}
@keyframes nod{50%{transform:rotate(2deg) translateY(-2px)}}
.owl-live.thinking{animation:bob .9s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-7px) rotate(-4deg)}}
.owl-live.happy{animation:hop .45s 3}
@keyframes hop{50%{transform:translateY(-14px) scale(1.05)}}
.talk{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:8px}
.talk>*{min-width:0}
.talk-owl{background:linear-gradient(160deg,var(--leaf-soft),var(--sky-soft));border-radius:22px;padding:16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.talk-owl .owl-live{width:96px;height:96px}
.owl-status{font-family:var(--display);font-weight:800;font-size:20px}
.voice-toggle{display:flex;gap:6px;align-items:center;font-weight:600;font-size:15px}
.tip{flex-basis:100%}
@media (min-width:900px){.talk{grid-template-columns:240px minmax(0,1fr)}.talk-owl{flex-direction:column;align-items:center;text-align:center;align-content:start}.talk-owl .owl-live{width:170px;height:170px}.tip{flex-basis:auto}}
.reply-choices{display:flex;gap:8px;flex-wrap:wrap}
.reply-choices button{border:0;border-radius:16px;padding:10px 18px;min-height:52px;font-family:var(--display);font-weight:800;font-size:20px;background:var(--marigold-soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.reply-choices button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
/* lesson stepper */
.lstep{display:grid;gap:14px}
.lstep-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.lstep-top .owl-live{width:84px;height:84px}
.say{background:var(--surface-2);border-radius:20px 20px 20px 6px;padding:14px 18px;font-size:21px;line-height:1.45;font-weight:500;min-height:64px}
.say.wait{color:var(--muted);font-style:italic;font-size:18px}
.lstep-media .fig{margin:0}
.lstep-media img{width:100%;max-height:320px;object-fit:cover;border-radius:16px;cursor:zoom-in}
.check{border:2px dashed var(--c,var(--line));border-radius:18px;padding:12px 14px;display:grid;gap:10px}
.check .qq{font-family:var(--display);font-weight:800;font-size:21px}
.check .ops{display:flex;gap:8px;flex-wrap:wrap}
.check .ops button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 16px;min-height:50px;font-size:19px;font-weight:700}
.check .ops button.right{border-color:var(--good);background:var(--leaf-soft)}
.check .ops button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.lstep-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.sdots i.on{background:var(--c,var(--leaf))}
.sdots i.cur{transform:scale(1.35);background:var(--marigold)}
/* writing pad */
.pad{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.pad-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pad-task{font-size:19px;font-weight:600;max-width:60ch}
.pad-task b{font-family:var(--display);font-size:22px;margin-right:8px}
.pad-board{flex:1;min-height:0;display:flex;flex-direction:column}
.pad-board .board{flex:1;min-height:0;display:flex;flex-direction:column}
.pad-board .board canvas{flex:1;min-height:0}
.pad .board-bar .sw{width:40px;height:40px}
.pad .board-bar .chip{min-height:42px;font-size:16px}
.work-shot{border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);width:100%;background:#FFFDF8;cursor:zoom-in}

@media (max-width:640px){
  body{font-size:16px}
  .hero{grid-template-columns:1fr;text-align:left}
  .hero .owl{width:84px;height:84px}
  .hero h1{font-size:28px}
  .jar{gap:8px}.jar .stat{padding:6px 10px}.jar .stat b{font-size:22px}.jar .stat span{font-size:10px}
  .photo-day{grid-template-columns:1fr}
  .step{grid-template-columns:46px 1fr;padding:10px 12px}

  .qtext{font-size:21px}
  .msg{max-width:96%}
  .chat{max-height:none}
  .hud .q{font-size:22px;padding:6px 12px}
  .choices button{min-width:70px;min-height:56px;font-size:26px}
}

.buddy>*{pointer-events:auto}

.owlbtn{width:92px;height:92px;border:0;background:none;padding:0;position:relative;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.owlbtn svg{width:100%;height:100%;display:block}
.owlbtn .dot{position:absolute;top:8px;right:6px;width:18px;height:18px;border-radius:50%;background:#F2A900;border:3px solid var(--surface)}
.owlbtn.awake .dot{background:#2ECC71}.owlbtn.off .dot{background:#9AA7A0}
.owl-live .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.6s infinite}
.owl-live .beak-low{transform-box:fill-box;transform-origin:center top;transform:scaleY(.25)}
.owl-live .owl-body{transform-box:fill-box;transform-origin:center bottom}

.talking .beak-low{animation:talk .24s infinite}

.owlbtn.off .lid{transform:scaleY(1);animation:none}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes talk{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}

@media (max-width:640px){.owlbtn{width:72px;height:72px}.buddy .cap{font-size:15px}.board-task{font-size:19px}.hero .owl-live{width:90px;height:90px}}

/* ---- iOS-grade polish ---- */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

button,a,.step,.tcard,.gcard,.sim-card,.subj,.opt,.chip,.starter,.ph,.mcard{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{user-select:none;-webkit-user-select:none}

.btn:active,.chip:active,.subj:active,.step:active,.tcard:active,.gcard:active,.sim-card:active,.opt:active,.starter:active,.ph:active,.sw:active,.letters button:active,.owlbtn:active{transform:scale(.96)}
@media (hover:hover){.tcard:hover,.gcard:hover,.sim-card:hover,.step:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(23,35,28,.06),0 14px 32px rgba(23,35,28,.12)}}
.top{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tab{display:flex;align-items:center;gap:6px}

main>section:not([hidden]){animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#DDF3E4 0%,#D6EAFB 55%,#FCEBD0 100%);box-shadow:var(--shadow)}

.glyph{background:linear-gradient(145deg,var(--c-soft),color-mix(in srgb,var(--c) 22%,var(--c-soft)))}
.card,.panel,.chatbox,.stage,.qcard,.step,.tcard,.gcard,.sim-card{border:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.chat{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

function earn(n,reason){
  const p=cur();if(!p||n<=0)return;
  const t=today();let st=p.streak||{last:"",days:0};
  if(st.last!==t){const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");st={last:t,days:st.last===ys?st.days+1:1}}
  saveProfile({stars:(p.stars||0)+n,streak:st});renderWallet();celebrate(n);
  toast(`+${n} star${n>1?"s":""}! ${reason||""}`);SFX.fanfare();

/* ---------- confetti burst ---------- */
function celebrate(n=3){
  if(REDUCED)return;const cv=$("burst");cv.hidden=false;const d=Math.min(2,devicePixelRatio||1);
  cv.width=innerWidth*d;cv.height=innerHeight*d;const x=cv.getContext("2d");x.setTransform(d,0,0,d,0,0);
  const cols=["#F2A900","#2E7D4F","#2B77B8","#B83E64","#7650B3","#C45A17"];const P=[];
  for(let i=0;i<60+n*20;i++)P.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,star:i%4===0});
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1000;x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-k/2.2);x.fillStyle=p.c;
      if(p.star){x.beginPath();for(let j=0;j<10;j++){const rr=j%2?p.r*.45:p.r*1.2,an=j*Math.PI/5-Math.PI/2;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}x.fill()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}
    if(k<2.2)requestAnimationFrame(f);else cv.hidden=true})(t0);
}

/* ---------- rich text + safe svg ---------- */
function cleanSVG(src){
  try{
    const doc=new DOMParser().parseFromString(src.trim(),"image/svg+xml");const svg=doc.documentElement;
    if(!svg||svg.nodeName.toLowerCase()!=="svg"||doc.getElementsByTagName("parsererror").length)return null;
    svg.querySelectorAll("script,foreignObject,iframe,image,audio,video,object,embed").forEach(n=>n.remove());
    svg.querySelectorAll("*").forEach(e=>{for(const a of Array.from(e.attributes)){const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
      if(n.startsWith("on"))e.removeAttribute(a.name);else if((n==="href"||n==="xlink:href")&&!v.startsWith("#"))e.removeAttribute(a.name);else if(v.includes("javascript:")||(v.includes("url(")&&!v.includes("url(#")))e.removeAttribute(a.name)}});
    if(!svg.getAttribute("viewBox")){const w=parseFloat(svg.getAttribute("width"))||320,h=parseFloat(svg.getAttribute("height"))||200;svg.setAttribute("viewBox",`0 0 ${w} ${h}`)}
    svg.removeAttribute("width");svg.removeAttribute("height");svg.setAttribute("role","img");
    return document.importNode(svg,true);
  }catch(e){return null}
}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/`([^`]+)`/g,"<code>$1</code>")}
function renderRich(text,box,streaming){
  box.textContent="";const parts=String(text).split(/```(\w*)[ \t]*\n?([\s\S]*?)(?:```|$)/g);
  for(let i=0;i<parts.length;i+=3){
    renderTextBlock(parts[i]||"",box);
    if(i+2<parts.length){const lang=(parts[i+1]||"").toLowerCase(),code=parts[i+2]||"";const fig=document.createElement("div");fig.className="fig";
      if(lang==="svg"||/^\s*<svg/i.test(code)){const svg=cleanSVG(code);if(svg)fig.appendChild(svg);else{fig.classList.add("wait");fig.textContent=streaming?"Drawing a picture…":"The picture could not be drawn."}}
      else fig.innerHTML=`<pre style="margin:0;white-space:pre-wrap">${esc(code)}</pre>`;box.appendChild(fig)}
  }
}
function renderTextBlock(t,box){
  const lines=t.split("\n");let list=null,para=[];
  const flush=()=>{if(para.length){const p=document.createElement("p");p.innerHTML=inline(para.join(" "));box.appendChild(p);para=[]}};
  for(const raw of lines){const l=raw.trim();let m;
    if(!l){flush();list=null;continue}
    if((m=l.match(/^PHOTO:\s*(.+)$/i))){flush();list=null;const ph=matchPhotos(m[1]);if(ph.length)box.appendChild(photoStrip(ph.slice(0,3)));continue}
    if((m=l.match(/^Curriculum:\s*(.+)$/i))){flush();list=null;const s=document.createElement("div");s.className="curtag";s.textContent="Curriculum · "+m[1];box.appendChild(s);continue}
    if((m=l.match(/^#{1,4}\s+(.+)$/))){flush();list=null;const h=document.createElement("h4");h.innerHTML=inline(m[1]);box.appendChild(h);continue}
    if((m=l.match(/^[-*•]\s+(.+)$/))||(m=l.match(/^\d+[.)]\s+(.+)$/))){flush();const ordered=/^\d/.test(l);
      if(!list||list.tagName!==(ordered?"OL":"UL")){list=document.createElement(ordered?"ol":"ul");box.appendChild(list)}
      const li=document.createElement("li");li.innerHTML=inline(m[1]);list.appendChild(li);continue}
    list=null;para.push(l);
  }flush();
}

/* ---------- textured 3D planet renderer ---------- */
const TEX={};
function loadTex(src){if(TEX[src])return TEX[src];const o={ready:false,data:null,w:0,h:0};TEX[src]=o;
  const im=new Image();im.onload=()=>{const w=512,h=256;const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);try{o.data=x.getImageData(0,0,w,h).data;o.w=w;o.h=h;o.ready=true}catch(e){}};im.src=src;return o}
function procTex(pl){const key="proc-"+pl.id;if(TEX[key])return TEX[key];const w=256,h=128,d=new Uint8ClampedArray(w*h*4);const [r,g,b]=pl.col;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;let n=pl.id==="uranus"?Math.sin(y*.18)*6+Math.sin(y*.05)*10:(Math.sin(x*.21+y*.13)*Math.cos(y*.27-x*.07)*18+Math.sin(x*.9+y*1.3)*8+(((x*7919+y*104729)%97)/97-.5)*30);
    d[i]=r+n;d[i+1]=g+n;d[i+2]=b+n;d[i+3]=255}
  return TEX[key]={ready:true,data:d,w,h}}
const sphereCache={};
function drawPlanet(ctx,pl,cx,cy,R,rot,light=[-.6,-.3,.75]){
  R=Math.max(2,Math.round(R));const tex=pl.tex?loadTex(pl.tex):procTex(pl);
  if(!tex.ready){ctx.fillStyle="#888";ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();return}
  const size=R*2;let sc=sphereCache[size];
  if(!sc){const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");const img=x.createImageData(size,size);const map=[];
    for(let py=0;py<size;py++)for(let px=0;px<size;px++){const nx=(px+.5-R)/R,ny=(py+.5-R)/R,q=nx*nx+ny*ny;if(q>1)continue;const nz=Math.sqrt(1-q);map.push(py*size+px,Math.atan2(nx,nz)/(2*Math.PI),.5+Math.asin(ny)/Math.PI,nx,ny,nz)}
    sc=sphereCache[size]={c,x,img,map}}
  const d=sc.img.data,m=sc.map,T=tex.data,tw=tex.w,th=tex.h;const L=Math.hypot(...light),lx=light[0]/L,ly=light[1]/L,lz=light[2]/L;
  for(let k=0;k<m.length;k+=6){let u=m[k+1]+.5+rot;u-=Math.floor(u);const v=m[k+2];const ti=((Math.min(th-1,(v*th)|0))*tw+((u*tw)|0))*4;
    const dot=m[k+3]*lx+m[k+4]*ly+m[k+5]*lz;const lit=.1+.95*Math.max(0,dot)+.08*Math.pow(Math.max(0,dot),12);const limb=.75+.25*m[k+5];const f=lit*limb;const o=m[k]*4;
    d[o]=Math.min(255,T[ti]*f);d[o+1]=Math.min(255,T[ti+1]*f);d[o+2]=Math.min(255,T[ti+2]*f);d[o+3]=255}
  sc.x.putImageData(sc.img,0,0);
  if(pl.rings)drawRings(ctx,cx,cy,R,true);
  ctx.drawImage(sc.c,cx-R,cy-R);
  if(pl.id==="earth"){const g=ctx.createRadialGradient(cx,cy,R*.95,cx,cy,R*1.12);g.addColorStop(0,"rgba(110,170,255,.35)");g.addColorStop(1,"rgba(110,170,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.12,0,7);ctx.fill()}
  if(pl.rings)drawRings(ctx,cx,cy,R,false);
}
function drawRings(ctx,cx,cy,R,back){ctx.save();ctx.translate(cx,cy);ctx.rotate(-.35);ctx.beginPath();if(back)ctx.rect(-R*2.4,-R*2,R*4.8,R*2);else ctx.rect(-R*2.4,0,R*4.8,R*2);ctx.clip();
  for(let i=0;i<14;i++){const rr=R*(1.3+i*.07);ctx.strokeStyle=`rgba(${210-i*4},${190-i*5},${150-i*4},${.55-(i%3)*.12})`;ctx.lineWidth=R*.06;ctx.beginPath();ctx.ellipse(0,0,rr,rr*.28,0,0,7);ctx.stroke()}ctx.restore()}
function planetDataURL(pl,R=120){const c=document.createElement("canvas");c.width=c.height=R*2+(pl.rings?R*3:20);const x=c.getContext("2d");x.fillStyle="#05080f";x.fillRect(0,0,c.width,c.height);
  for(let i=0;i<60;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.8})`;x.fillRect(Math.random()*c.width,Math.random()*c.height,1.2,1.2)}
  drawPlanet(x,pl,c.width/2,c.height/2,R,.1);return c.toDataURL("image/jpeg",.85)}

const GRADE_LISTS={cbse:["Nursery / KG",...Array.from({length:12},(_,i)=>"Class "+(i+1))],icse:Array.from({length:12},(_,i)=>"Class "+(i+1)),nc:["Reception",...Array.from({length:13},(_,i)=>"Year "+(i+1))],cam:[...Array.from({length:9},(_,i)=>"Stage "+(i+1))],igcse:["Year 10","Year 11"],alevel:["AS Level","A Level"],pyp:Array.from({length:6},(_,i)=>"PYP Grade "+i),myp:Array.from({length:5},(_,i)=>"MYP Year "+(i+1)),dp:["DP Year 1","DP Year 2"],us:["Kindergarten",...Array.from({length:12},(_,i)=>"Grade "+(i+1))],uae:["KG",...Array.from({length:12},(_,i)=>"Grade "+(i+1))],home:["Early years",...Array.from({length:12},(_,i)=>"Grade "+(i+1)),"Adult learner"]};
function curKind(c){c=String(c||"");if(/CBSE/i.test(c))return "cbse";if(/ICSE/i.test(c))return "icse";if(/England|National Curriculum/i.test(c))return "nc";if(/Cambridge Primary|Lower Secondary/i.test(c))return "cam";if(/IGCSE/i.test(c))return "igcse";if(/A Level/i.test(c))return "alevel";if(/PYP/i.test(c))return "pyp";if(/MYP/i.test(c))return "myp";if(/Diploma/i.test(c))return "dp";if(/American|Common Core/i.test(c))return "us";if(/UAE/i.test(c))return "uae";return "home"}
function gradeNum(g){const m=String(g||"").match(/(\d+)/);return m?+m[1]:0}
function defaultGrade(kind,a){const L=GRADE_LISTS[kind];const n={cbse:a-5,icse:a-5,nc:a-5,cam:a-5,us:a-5,uae:a-5,home:a-5,pyp:a-6,myp:a-10,igcse:a-14,alevel:a-16,dp:a-16}[kind];
  const pre={cbse:"Class ",icse:"Class ",nc:"Year ",cam:"Stage ",us:"Grade ",uae:"Grade ",home:"Grade ",pyp:"PYP Grade ",myp:"MYP Year "}[kind];
  if(pre){const c=pre+Math.max(1,n);return L.includes(c)?c:L[L.length-1]}return L[Math.max(0,Math.min(L.length-1,n))]}
function fromStrings(key,lv,subject,arr){const [book,list]=arr;return list.map((line,i)=>{const [ref,concept]=line.split(" :: ");const c=(concept||ref).trim();
  return {id:`${key}${lv}-${subject}-${i+1}`,t:c,goal:c,ref:`${book} · ${ref.trim()}`,task:`Draw or write what you learned: ${c}.`}})}
const PATH_CACHE={};
function pathInfo(subject){const p=cur()||{};const key=[p.id,p.curriculum,p.grade,age(),subject,p.path&&p.path[subject]?p.path[subject].length:0].join("|");return PATH_CACHE[key]||(PATH_CACHE[key]=pathInfoRaw(subject))}
function pathInfoRaw(subject){

  if(subject==="rigveda")return {list:a<=7?RIGVEDA_BANDS.young:a<=11?RIGVEDA_BANDS.middle:RIGVEDA_BANDS.teen,src:"Rig Veda enrichment for ages "+(a<=7?"5–7":a<=11?"8–11":"12+")+" (not examined by school boards)"};
  if(p.path&&p.path[subject])return {list:p.path[subject],src:`Built for ${p.curriculum}, ${p.grade}`};
  if(subject==="hindi"||subject==="sanskrit"){const lv=kind==="cbse"&&L?L:Math.max(1,Math.min(8,a-5));
    if(subject==="sanskrit"&&lv<6&&a>=8)return {list:SANSKRIT_MID,src:"Sanskrit foundations for ages 8–10 (CBSE Sanskrit textbooks start in Class 6)"};
    if(subject==="sanskrit"&&lv<6)return {list:SANSKRIT_YOUNG,src:"Sanskrit foundations (CBSE Sanskrit textbooks start in Class 6)"};
    const d=(CUR.cbse.levels[Math.min(8,lv)]||{})[subject];
    if(d)return {list:fromStrings("cbse",Math.min(8,lv),subject,d),src:`CBSE Class ${Math.min(8,lv)} · ${d[0]}`+(kind==="cbse"?"":" (CBSE-aligned, matched by age)")}}
  const key=["cbse","nc","cam"].includes(kind)?kind:null;
  if(key&&L&&CUR[key].levels[L]&&CUR[key].levels[L][subject]){const d=CUR[key].levels[L][subject];return {list:fromStrings(key,L,subject,d),src:key==="cbse"?`CBSE Class ${L} · ${d[0]}`:d[0]}}

}

function levelFor(sub){const rec=S.attempts.filter(a=>a.subject===sub).slice(0,3);if(!rec.length)return "just right";const avg=rec.reduce((t,a)=>t+a.score/a.total,0)/rec.length;return avg>=.8?"challenging":avg<.5?"easy":"just right"}

async function runQuiz(host,{subject,topic,count,onDone}){

  host.innerHTML='<p class="thinking" style="margin-top:12px">Chiku is making fresh questions…</p>';
  const lvl=levelFor(subject),weak=weakSkills(subject).slice(0,3).map(w=>w[0]),L=(LANG[S.lang]||LANG.en).name;
  try{
    const q=await S.sample.json(`${learnerBrief()}\nWrite a ${count}-question multiple-choice quiz in ${SUBJ[subject].name}${topic?` on "${topic}"`:` covering these syllabus topics for ${(cur()||{}).curriculum} ${(cur()||{}).grade}: ${pathFor(subject).slice(0,14).map(x=>x.t).join("; ")}`}. Difficulty: ${lvl} for this learner's age and curriculum. Language: ${L} (Hindi/Sanskrit/Rig Veda in Devanagari, with transliteration if the language is not Hindi).${weak.length?` Include some questions on skills they missed before: ${weak.join("; ")}.`:""}

Reply only JSON: {"title":string,"questions":[{"q":string,"options":[string,string,string,string],"answer":0-3,"hint":string,"explain":string,"skill":string (3-6 words)}]}`,{modelTier:ageBand()==="teen"||ageBand()==="adult"?"default":"quick",cache:false});
    const qs=(q&&q.questions||[]).filter(x=>x&&x.q&&Array.isArray(x.options)&&x.options.length>=2&&Number.isInteger(+x.answer)&&+x.answer<x.options.length).map(x=>({...x,answer:+x.answer}));

function renderQ(host,Q,onDone){

function answerQ(host,Q,k,opts,card,onDone){
  const q=Q.qs[Q.i],ok=k===q.answer;[...opts.children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add("right");else if(j===k)b.classList.add("wrong")});

  host.append(card);if(pct>=.6)celebrate(2);

    for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,a0,a1);x.closePath();x.fillStyle=i<k?css("--marigold"):css("--surface");x.fill();x.lineWidth=3;x.strokeStyle=css("--saffron");x.stroke()}
    x.beginPath();x.arc(cx,cy,r,0,7);x.lineWidth=8;x.strokeStyle=css("--saffron");x.stroke();
    const bx=w*.62,bw=w*.33,bh=34,by=cy-bh/2;for(let i=0;i<n;i++){x.fillStyle=i<k?css("--sky"):css("--surface");x.fillRect(bx+i*bw/n,by,bw/n,bh);x.strokeStyle=css("--ink");x.lineWidth=1.5;x.strokeRect(bx+i*bw/n,by,bw/n,bh)}

{id:"hop",subject:"maths",title:"Number line hops",blurb:"Watch a frog hop along a number line to add and subtract.",mount(stage){
  stage.append(el(`<div class="controls"><label for="nlA">Start <input id="nlA" type="number" value="3" min="-20" max="20" style="width:80px"></label><label for="nlOp">Do <select id="nlOp"><option value="1">add +</option><option value="-1">take away −</option></select></label><label for="nlB">Hops <input id="nlB" type="number" value="4" min="0" max="15" style="width:80px"></label><button class="btn small" id="nlGo" type="button">Hop!</button><span class="readout" id="nlOut"></span></div>`));
  const cv=el(`<canvas aria-label="Number line"></canvas>`);stage.append(cv);
  stage.append(el(`<div class="explain">Adding moves <b>right</b> (bigger numbers). Taking away moves <b>left</b> (smaller numbers). Count each hop out loud!</div>`));
  const fit=setupCanvas(cv,.34);let g=fit();let anim={p:0,run:false,from:3,to:7};let stop=null;
  const lo=()=>Math.min(anim.from,anim.to,0)-1,hi=()=>Math.max(anim.from,anim.to,10)+1;
  const draw=()=>{const {x,w,h}=g;x.clearRect(0,0,w,h);const a=lo(),b=hi(),sx=v=>30+(v-a)*(w-60)/(b-a),y=h*.72;
    x.strokeStyle=css("--ink");x.lineWidth=2.5;x.beginPath();x.moveTo(16,y);x.lineTo(w-16,y);x.stroke();
    x.font="600 14px Mukta, sans-serif";x.textAlign="center";x.fillStyle=css("--ink");
    for(let v=a;v<=b;v++){x.beginPath();x.moveTo(sx(v),y-7);x.lineTo(sx(v),y+7);x.stroke();if((b-a)<=26||v%2===0)x.fillText(v,sx(v),y+26)}
    const steps=Math.abs(anim.to-anim.from),dir=Math.sign(anim.to-anim.from)||1,done=anim.p*steps;
    x.strokeStyle=css("--marigold");x.lineWidth=3;
    for(let i=0;i<Math.floor(done);i++){const s=sx(anim.from+i*dir),e=sx(anim.from+(i+1)*dir);x.beginPath();x.moveTo(s,y);x.quadraticCurveTo((s+e)/2,y-60,e,y);x.stroke()}
    const i=Math.floor(done),f=done-i;let fx,fy;
    if(i>=steps){fx=sx(anim.to);fy=y}else{const s=sx(anim.from+i*dir),e=sx(anim.from+(i+1)*dir);fx=s+(e-s)*f;fy=y-4*f*(1-f)*60}
    x.fillStyle=css("--leaf");x.beginPath();x.ellipse(fx,fy-14,15,12,0,0,7);x.fill();x.fillStyle=css("--surface");x.beginPath();x.arc(fx-6,fy-22,4,0,7);x.arc(fx+6,fy-22,4,0,7);x.fill();x.fillStyle=css("--ink");x.beginPath();x.arc(fx-6,fy-22,2,0,7);x.arc(fx+6,fy-22,2,0,7);x.fill()};
  const go=()=>{const A=Math.max(-20,Math.min(20,+$("nlA").value||0)),B=Math.max(0,Math.min(15,+$("nlB").value||0)),op=+$("nlOp").value;anim={p:0,from:A,to:A+op*B};
    $("nlOut").textContent=`${A} ${op>0?"+":"−"} ${B} = ${A+op*B}`;

  $("nlGo").onclick=go;const ro=new ResizeObserver(()=>{g=fit();draw()});ro.observe(cv);anim.p=1;anim.from=3;anim.to=7;$("nlOut").textContent="3 + 4 = 7";draw();
  return()=>{ro.disconnect();if(stop)stop()};
}},
{id:"matter",subject:"science",title:"States of matter",blurb:"Heat and cool water and watch the particles move as ice, water and steam.",mount(stage){
  stage.append(el(`<div class="controls"><label for="smT">Temperature <input id="smT" type="range" min="-30" max="150" value="20"></label><span class="readout" id="smOut"></span></div>`));
  const cv=el(`<canvas aria-label="Water particles"></canvas>`);stage.append(cv);const ex=el(`<div class="explain"></div>`);stage.append(ex);
  const fit=setupCanvas(cv,.5);let g=fit();const N=48;const P=[];
  for(let i=0;i<N;i++)P.push({hx:(i%8),hy:Math.floor(i/8),x:0,y:0,vx:Math.random()-.5,vy:Math.random()-.5});
  const init=()=>{const {w,h}=g;P.forEach(p=>{p.x=w/2-70+p.hx*20;p.y=h-30-p.hy*20})};init();
  const text=T=>T<=0?["Solid: ice","Particles are packed tightly in a pattern. They only <b>vibrate</b> in place, so ice keeps its shape."]:T<100?["Liquid: water","Particles are close but can <b>slide past</b> each other, so water flows and takes the shape of its container."]:["Gas: steam","Particles have lots of energy and <b>spread out</b> fast in every direction, filling the whole space."];
  const upd=()=>{const T=+$("smT").value;const [a,b]=text(T);$("smOut").textContent=`${T} °C · ${a}`;ex.innerHTML=b+` Water melts at <b>0 °C</b> and boils at <b>100 °C</b> (at sea level).`};
  $("smT").oninput=upd;upd();
  const stop=loop(()=>{const {x,w,h}=g;const T=+$("smT").value;x.clearRect(0,0,w,h);
    const sp=T<=0?0:T<100?0.6+T/60:3+T/40;
    P.forEach(p=>{
      if(T<=0){const tx=w/2-70+p.hx*20,ty=h-30-p.hy*20,j=0.6+(T+30)/25;p.x+=(tx-p.x)*.2+(Math.random()-.5)*j;p.y+=(ty-p.y)*.2+(Math.random()-.5)*j}
      else{p.vx+=(Math.random()-.5)*.3*sp;p.vy+=(Math.random()-.5)*.3*sp+(T<100?.25:0);const m=Math.hypot(p.vx,p.vy)||1,lim=sp*1.6;if(m>lim){p.vx*=lim/m;p.vy*=lim/m}p.x+=p.vx;p.y+=p.vy;
        const floor=h-12,top=T<100?h*.45:12;if(p.x<12||p.x>w-12){p.vx*=-1;p.x=Math.max(12,Math.min(w-12,p.x))}if(p.y>floor){p.y=floor;p.vy*=-.5}if(p.y<top){p.y=top;p.vy=Math.abs(p.vy)}}
      x.beginPath();x.arc(p.x,p.y,8,0,7);x.fillStyle=T<=0?css("--sky"):T<100?css("--leaf"):css("--berry");x.fill()});
    x.strokeStyle=css("--muted");x.lineWidth=3;x.strokeRect(6,6,w-12,h-12)});
  const ro=new ResizeObserver(()=>{g=fit();init()});ro.observe(cv);return()=>{ro.disconnect();stop()};
}},
{id:"plant",subject:"science",title:"Plant growing lab",blurb:"Change sunlight and water, then grow a plant for a week at a time.",mount(stage){
  stage.append(el(`<div class="controls"><label for="plSun">Sunlight <input id="plSun" type="range" min="0" max="10" value="7"></label><label for="plWater">Water <input id="plWater" type="range" min="0" max="10" value="5"></label><button class="btn small" id="plGrow" type="button">Grow 1 week</button><button class="btn ghost small" id="plReset" type="button">Start again</button><span class="readout" id="plOut"></span></div>`));
  const cv=el(`<canvas aria-label="Plant"></canvas>`);stage.append(cv);const ex=el(`<div class="explain"></div>`);stage.append(ex);
  const fit=setupCanvas(cv,.5);let g=fit();let st={wk:0,hgt:10,leaves:2,health:1};let target=null,stop=null;
  const draw=()=>{const {x,w,h}=g;const sun=+$("plSun").value;x.clearRect(0,0,w,h);
    x.fillStyle=css("--surface-2");x.fillRect(0,0,w,h);
    x.globalAlpha=.25+sun/12;x.fillStyle=css("--marigold");x.beginPath();x.arc(w-60,54,24+sun*2,0,7);x.fill();x.globalAlpha=1;
    const gy=h-40;x.fillStyle=css("--saffron");x.fillRect(w/2-60,gy,120,40);
    const top=gy-st.hgt*1.6;x.strokeStyle=st.health>.5?css("--leaf"):css("--marigold");x.lineWidth=6;x.beginPath();x.moveTo(w/2,gy);x.quadraticCurveTo(w/2+10,(gy+top)/2,w/2,top);x.stroke();
    for(let i=0;i<st.leaves;i++){const ly=gy-(i+1)*(gy-top)/(st.leaves+1),s=i%2?1:-1;x.fillStyle=st.health>.5?css("--leaf"):css("--marigold");x.beginPath();x.ellipse(w/2+s*18,ly,20,9,s*.5,0,7);x.fill()}
    if(st.wk>=4&&st.health>.7){x.fillStyle=css("--berry");for(let a=0;a<6;a++){x.beginPath();x.arc(w/2+Math.cos(a)*10,top+Math.sin(a)*10,7,0,7);x.fill()}x.fillStyle=css("--marigold");x.beginPath();x.arc(w/2,top,6,0,7);x.fill()}
    $("plOut").textContent=`Week ${st.wk} · ${Math.round(st.hgt)} cm`};
  const explain=()=>{const s=+$("plSun").value,wa=+$("plWater").value;let t="Plants make their own food using <b>sunlight</b>, <b>water</b> and <b>carbon dioxide</b> from the air. This is called <b>photosynthesis</b>, and it gives out the oxygen we breathe.";
    if(s<3)t+=" Not enough light: the plant grows pale and weak.";else if(wa<3)t+=" Too little water: the leaves droop and turn yellow.";else if(wa>8)t+=" Too much water: the roots can't breathe, so growth slows.";else t+=" Good balance: the plant is healthy!";
    const p=cur();if(p&&p.age>=11)t+=" <br>Word equation: carbon dioxide + water → glucose + oxygen (using light energy, in the chloroplasts).";ex.innerHTML=t};
  const grow=()=>{const s=+$("plSun").value,wa=+$("plWater").value;const health=Math.max(0,Math.min(1,(s/10)*(1-Math.abs(wa-5.5)/6)*1.4));
    target={hgt:st.hgt+2+health*14,leaves:Math.min(12,st.leaves+(health>.35?2:0))};const from={...st};st.wk++;st.health=health;
    if(stop)stop();if(REDUCED){st.hgt=target.hgt;st.leaves=target.leaves;draw();explain();return}
    const t0=performance.now();stop=loop(t=>{const k=Math.min(1,(t-t0)/900);st.hgt=from.hgt+(target.hgt-from.hgt)*k;st.leaves=k>.5?target.leaves:from.leaves;draw();if(k>=1&&stop){stop();stop=null}});explain()};
  $("plGrow").onclick=grow;$("plReset").onclick=()=>{st={wk:0,hgt:10,leaves:2,health:1};draw();explain()};
  $("plSun").oninput=()=>{draw();explain()};$("plWater").oninput=explain;
  const ro=new ResizeObserver(()=>{g=fit();draw()});ro.observe(cv);draw();explain();return()=>{ro.disconnect();if(stop)stop()};
}},

{id:"ushas",subject:"rigveda",title:"Dawn with Ushas",blurb:"Slide from night to sunrise and meet the Rig Veda's hymns to the dawn and the sun.",mount(stage){
  stage.append(el(`<div class="controls"><label for="usT">Night → Sunrise <input id="usT" type="range" min="0" max="100" value="55"></label><button class="btn small" id="usSay" type="button">Listen to the mantra</button></div>`));
  const cv=el(`<canvas aria-label="Sunrise"></canvas>`);stage.append(cv);
  stage.append(el(`<div class="explain"><p style="margin:0 0 6px"><b>Ushas</b> (उषस्) is the dawn in the Rig Veda, the oldest of the four Vedas, composed in Vedic Sanskrit over 3,000 years ago and passed down by memory. More than twenty of its hymns praise her for waking every living being. <b>Savitr</b> (सवितृ) is the sun as the one who sets the world in motion.</p>
  <p class="verse" lang="sa" style="margin:6px 0 2px">तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि। धियो यो नः प्रचोदयात्॥</p>
  <p style="margin:0 0 4px;font-style:italic">tat savitur vareṇyaṃ bhargo devasya dhīmahi, dhiyo yo naḥ pracodayāt</p>
  <p style="margin:0"><b>Meaning:</b> “We meditate on the wonderful light of the divine Savitr; may it inspire our minds.” This is the <b>Gayatri mantra</b>, Rig Veda 3.62.10, in the gāyatrī metre of 3 lines × 8 syllables. The opening “ॐ भूर्भुवः स्वः” that people chant before it was added in later tradition.</p></div>`));
  const fit=setupCanvas(cv,.45);let g=fit();
  const draw=()=>{const {x,w,h}=g;const t=+$("usT").value/100;
    const grd=x.createLinearGradient(0,0,0,h);const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
    const top=mix([16,22,48],[120,180,235],t),mid=mix([30,30,70],[250,170,90],Math.min(1,t*1.4)),bot=mix([20,25,40],[255,210,130],t);
    grd.addColorStop(0,`rgb(${top})`);grd.addColorStop(.6,`rgb(${mid})`);grd.addColorStop(1,`rgb(${bot})`);x.fillStyle=grd;x.fillRect(0,0,w,h);
    x.fillStyle=`rgba(255,255,255,${Math.max(0,.9-t*2)})`;for(let i=0;i<40;i++){x.fillRect((i*97)%w,(i*53)%(h*.6),2,2)}
    const sy=h*.95-t*h*.55;x.fillStyle="#FFC54D";x.beginPath();x.arc(w*.5,sy,30,0,7);x.fill();
    x.fillStyle=`rgba(255,197,77,${t*.25})`;x.beginPath();x.arc(w*.5,sy,60,0,7);x.fill();
    x.fillStyle="#2B3A2C";x.beginPath();x.moveTo(0,h);x.lineTo(0,h*.8);x.quadraticCurveTo(w*.25,h*.68,w*.5,h*.82);x.quadraticCurveTo(w*.75,h*.7,w,h*.8);x.lineTo(w,h);x.fill();
    x.fillStyle="#fff";x.font='600 16px Mukta, sans-serif';x.textAlign="left";x.fillText(t<.3?"Night (रात्रि)":t<.7?"Dawn (उषा)":"Sunrise (सूर्योदय)",14,26)};
  $("usT").oninput=draw;$("usSay").onclick=()=>speak("तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि। धियो यो नः प्रचोदयात्॥","sa");
  const ro=new ResizeObserver(()=>{g=fit();draw()});ro.observe(cv);draw();return()=>ro.disconnect();
}},

const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mathQ(){const a=age();let x,y,op,ans;const r=Math.random();
  if(a<=5){x=randi(1,5);y=randi(1,4);op="+"}
  else if(a<=7){if(r<.6){x=randi(2,12);y=randi(1,8);op="+"}else{x=randi(6,18);y=randi(1,Math.min(9,x-1));op="−"}}
  else if(a<=9){if(r<.35){x=randi(10,60);y=randi(5,39);op="+"}else if(r<.65){x=randi(20,99);y=randi(5,x-5);op="−"}else{x=randi(2,10);y=randi(2,10);op="×"}}
  else{if(r<.4){x=randi(3,12);y=randi(3,12);op="×"}else if(r<.7){y=randi(2,12);x=y*randi(2,12);op="÷"}else{x=randi(100,500);y=randi(50,300);op="+"}}
  ans=op==="+"?x+y:op==="−"?x-y:op==="×"?x*y:x/y;return {text:`${x} ${op} ${y} = ?`,say:`${x} ${op==="−"?"minus":op==="×"?"times":op==="÷"?"divided by":"plus"} ${y}`,ans}}
function distract(ans,n){const s=new Set([ans]);let k=1;while(s.size<n+1){const d=ans+(Math.random()<.5?-1:1)*randi(1,Math.max(3,Math.round(ans*.3)));if(d>=0)s.add(d);if(++k>60)s.add(ans+s.size)}s.delete(ans);return [...s]}

function Arena(host,ratio=.62,max=640){
  const wrap=el(`<div class="arena"><canvas></canvas><div class="hud"></div></div>`);host.append(wrap);
  const cv=wrap.querySelector("canvas"),ctx=cv.getContext("2d");let W=800,H=500;
  const fit=()=>{W=cv.clientWidth||800;H=Math.round(Math.min(W*ratio,max));const d=Math.min(3,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;cv.style.height=H+"px";ctx.setTransform(d,0,0,d,0,0);A.onResize&&A.onResize()};
  const A={wrap,cv,ctx,hud:wrap.querySelector(".hud"),get W(){return W},get H(){return H},onResize:null,
    pt(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]},
    over(node){wrap.querySelector(".over")?.remove();if(node){const o=el(`<div class="over"></div>`);o.append(node);wrap.append(o)}},
    run(step){let last=performance.now(),id=0,alive=true;const f=t=>{if(!alive)return;const dt=Math.min(.05,(t-last)/1000);last=t;if(!document.hidden)step(dt,t/1000);id=requestAnimationFrame(f)};id=requestAnimationFrame(f);return()=>{alive=false;cancelAnimationFrame(id)}},
    destroy(){ro.disconnect();wrap.remove()}};
  const ro=new ResizeObserver(fit);ro.observe(cv);fit();return A;
}

function cloudSprite(w){const c=document.createElement("canvas");const h=w*.5;c.width=w;c.height=h;const x=c.getContext("2d");
  const blobs=[[.28,.62,.2],[.45,.45,.26],[.64,.52,.22],[.78,.64,.16],[.16,.7,.13]];
  for(const [bx,by,br] of blobs){const g=x.createRadialGradient(bx*w,by*h-br*w*.3,br*w*.2,bx*w,by*h,br*w);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.75,"rgba(245,250,255,.95)");g.addColorStop(1,"rgba(225,236,248,0)");x.fillStyle=g;x.beginPath();x.arc(bx*w,by*h,br*w,0,7);x.fill()}return c}
function drawHills(x,W,H,t,base){
  const layers=[[.72,"#9CCB86","#7DB06A",.3,40],[.8,"#6FAE5B","#4E8E43",.6,28],[.9,"#4E9446","#357A33",1,20]];
  layers.forEach(([yy,c1,c2,par,amp],i)=>{const y0=H*yy;const g=x.createLinearGradient(0,y0-amp,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.beginPath();x.moveTo(0,H);
    for(let px=0;px<=W+10;px+=10){x.lineTo(px,y0+Math.sin(px/(140+i*60)+i*2+base*par)*amp*.6+Math.sin(px/57+i)*amp*.15)}x.lineTo(W,H);x.fill();
    if(i===0){for(let k=0;k<5;k++){const px=((k*W/4.3)+60)%W,py=y0+Math.sin(px/140+base*par)*amp*.6-2;palm(x,px,py,20+k%2*6)}}});
}
function palm(x,px,py,s){x.strokeStyle="#5A6B3A";x.lineWidth=s*.12;x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+s*.15,py-s*.6,px+s*.05,py-s*1.2);x.stroke();
  x.fillStyle="#4F7A35";for(let a=0;a<6;a++){const an=-Math.PI/2+(a-2.5)*.55;x.beginPath();x.moveTo(px+s*.05,py-s*1.2);x.quadraticCurveTo(px+s*.05+Math.cos(an)*s*.5,py-s*1.2+Math.sin(an)*s*.5-s*.1,px+s*.05+Math.cos(an)*s*.8,py-s*1.2+Math.sin(an)*s*.8+s*.25);x.lineTo(px+s*.05,py-s*1.15);x.fill()}}
function drawBalloon(x,cx,cy,r,h,val,sway,shake){
  cx+=shake?Math.sin(performance.now()/30)*6*shake:0;
  x.strokeStyle="rgba(255,255,255,.85)";x.lineWidth=1.4;x.beginPath();x.moveTo(cx,cy+r*1.18);x.bezierCurveTo(cx+sway*14,cy+r*1.8,cx-sway*14,cy+r*2.4,cx+sway*8,cy+r*3.1);x.stroke();
  x.save();x.shadowColor="rgba(0,0,0,.18)";x.shadowBlur=12;x.shadowOffsetY=6;
  x.beginPath();x.moveTo(cx,cy+r*1.1);x.bezierCurveTo(cx+r*1.25,cy+r*.7,cx+r*1.05,cy-r*1.15,cx,cy-r*1.1);x.bezierCurveTo(cx-r*1.05,cy-r*1.15,cx-r*1.25,cy+r*.7,cx,cy+r*1.1);
  const g=x.createRadialGradient(cx-r*.35,cy-r*.45,r*.08,cx,cy,r*1.3);g.addColorStop(0,`hsl(${h},95%,80%)`);g.addColorStop(.45,`hsl(${h},82%,56%)`);g.addColorStop(1,`hsl(${h},78%,32%)`);x.fillStyle=g;x.fill();x.restore();
  x.fillStyle="rgba(255,255,255,.55)";x.beginPath();x.ellipse(cx-r*.38,cy-r*.45,r*.16,r*.3,-.5,0,7);x.fill();
  x.fillStyle="rgba(255,255,255,.25)";x.beginPath();x.ellipse(cx+r*.35,cy+r*.35,r*.08,r*.15,-.5,0,7);x.fill();
  x.fillStyle=`hsl(${h},70%,32%)`;x.beginPath();x.moveTo(cx,cy+r*1.08);x.lineTo(cx-r*.13,cy+r*1.26);x.lineTo(cx+r*.13,cy+r*1.26);x.fill();
  if(val!==undefined&&val!==null){x.font=`800 ${Math.round(r*.78)}px "Baloo 2", system-ui, sans-serif`;x.textAlign="center";x.textBaseline="middle";x.lineWidth=5;x.strokeStyle="rgba(0,0,0,.35)";x.strokeText(val,cx,cy+r*.05);x.fillStyle="#fff";x.fillText(val,cx,cy+r*.05)}
}
function drawRocket(x,cx,cy,s,tilt=0){
  x.save();x.translate(cx,cy);x.rotate(tilt);
  // fins
  const fg=x.createLinearGradient(-s*.6,0,s*.6,0);fg.addColorStop(0,"#8E1B1B");fg.addColorStop(.5,"#E0413A");fg.addColorStop(1,"#8E1B1B");x.fillStyle=fg;
  x.beginPath();x.moveTo(-s*.28,s*.35);x.lineTo(-s*.62,s*.95);x.lineTo(-s*.28,s*.82);x.fill();x.beginPath();x.moveTo(s*.28,s*.35);x.lineTo(s*.62,s*.95);x.lineTo(s*.28,s*.82);x.fill();
  // nozzle
  const ng=x.createLinearGradient(-s*.2,0,s*.2,0);ng.addColorStop(0,"#3a3f47");ng.addColorStop(.5,"#9aa3ad");ng.addColorStop(1,"#3a3f47");x.fillStyle=ng;x.beginPath();x.moveTo(-s*.16,s*.86);x.lineTo(s*.16,s*.86);x.lineTo(s*.22,s*1.02);x.lineTo(-s*.22,s*1.02);x.fill();
  // body
  const bg=x.createLinearGradient(-s*.3,0,s*.3,0);bg.addColorStop(0,"#9AA6B2");bg.addColorStop(.35,"#FFFFFF");bg.addColorStop(.7,"#E3E8EE");bg.addColorStop(1,"#7F8B97");x.fillStyle=bg;
  x.beginPath();x.moveTo(-s*.3,s*.88);x.lineTo(-s*.3,-s*.3);x.bezierCurveTo(-s*.3,-s*.75,-s*.12,-s*1.05,0,-s*1.2);x.bezierCurveTo(s*.12,-s*1.05,s*.3,-s*.75,s*.3,-s*.3);x.lineTo(s*.3,s*.88);x.closePath();x.fill();
  // nose
  x.save();x.clip();const cg=x.createLinearGradient(-s*.3,0,s*.3,0);cg.addColorStop(0,"#8E1B1B");cg.addColorStop(.4,"#F05A4F");cg.addColorStop(1,"#8E1B1B");x.fillStyle=cg;x.fillRect(-s*.4,-s*1.3,s*.8,s*.72);
  x.fillStyle="rgba(30,60,120,.85)";x.fillRect(-s*.4,s*.46,s*.8,s*.08);x.restore();
  // window
  x.fillStyle="#C9D2DB";x.beginPath();x.arc(0,-s*.18,s*.17,0,7);x.fill();const wg=x.createRadialGradient(-s*.05,-s*.24,s*.02,0,-s*.18,s*.13);wg.addColorStop(0,"#BFE7FF");wg.addColorStop(1,"#1F5F9E");x.fillStyle=wg;x.beginPath();x.arc(0,-s*.18,s*.13,0,7);x.fill();
  x.fillStyle="rgba(255,255,255,.7)";x.beginPath();x.ellipse(-s*.05,-s*.23,s*.04,s*.025,-.6,0,7);x.fill();
  x.fillStyle="#1E3A6E";x.font=`800 ${Math.max(8,s*.13)}px "Baloo 2", sans-serif`;x.textAlign="center";x.save();x.translate(0,s*.22);x.rotate(-Math.PI/2);x.fillText("VIDYA",0,s*.04);x.restore();
  x.restore();
}
function drawFish(x,f,t){
  const s=f.size;x.save();x.translate(f.x,f.y);if(f.dir<0)x.scale(-1,1);const wag=Math.sin(t*9+f.ph)*.35;
  x.fillStyle=`hsl(${f.hue},80%,45%)`;x.beginPath();x.moveTo(-s*.8,0);x.lineTo(-s*1.35,-s*.45+wag*s*.3);x.quadraticCurveTo(-s*1.2,0,-s*1.35,s*.45+wag*s*.3);x.closePath();x.fill();
  x.beginPath();x.moveTo(-s*.2,-s*.45);x.quadraticCurveTo(s*.1,-s*.85,s*.35,-s*.42);x.fill();
  const g=x.createLinearGradient(0,-s*.55,0,s*.55);g.addColorStop(0,`hsl(${f.hue},85%,62%)`);g.addColorStop(.55,`hsl(${f.hue},80%,50%)`);g.addColorStop(1,`hsl(${f.hue+20},70%,78%)`);x.fillStyle=g;
  x.beginPath();x.ellipse(0,0,s,s*.55,0,0,7);x.fill();
  x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=1.2;for(let i=0;i<3;i++){x.beginPath();x.arc(-s*.1-i*s*.22,0,s*.4,-.9,.9);x.stroke()}
  x.fillStyle="#fff";x.beginPath();x.arc(s*.58,-s*.12,s*.15,0,7);x.fill();x.fillStyle="#111";x.beginPath();x.arc(s*.62,-s*.12,s*.08,0,7);x.fill();
  x.restore();
  if(f.letter){x.fillStyle="rgba(255,255,255,.95)";x.beginPath();x.arc(f.x-f.dir*s*.1,f.y+s*.02,s*.42,0,7);x.fill();x.fillStyle="#17231C";x.font=`800 ${Math.round(s*.55)}px "Baloo 2", Mukta, sans-serif`;x.textAlign="center";x.textBaseline="middle";x.fillText(f.letter,f.x-f.dir*s*.1,f.y+s*.06)}
}

function playsLeft(){const p=cur()||{};const lim=p.playLimit||6;const pl=p.plays&&p.plays.d===today()?p.plays.n:0;return lim-pl}
function startGame(id){
  const g=GAMES.find(x=>x.id===id);const host=$("arenaHost");if(!host)return;stopGame();host.textContent="";
  const box=el(`<div class="card" style="display:grid;gap:12px;justify-items:start"><h2 style="font-size:26px"></h2><p></p><div class="tools"></div></div>`);box.querySelector("h2").textContent=g.name;

  else{box.querySelector("p").textContent=`${g.blurb} This round costs ${g.cost} stars. You have ${wallet()}.`;
    const pb=el(`<button class="btn big alt" type="button">Play for ${g.cost} ★</button>`);pb.onclick=()=>{SFX.init();if(!spend(g.cost))return;const p=cur();saveProfile({plays:{d:today(),n:(p.plays&&p.plays.d===today()?p.plays.n:0)+1}});host.textContent="";launchGame(id,host)};tl.append(pb)}

}

function endGame(id,host,score,label){
  const p=cur();const games={...(p.games||{})};const best=Math.max(score,(games[id]||{}).best||0);const isBest=score>((games[id]||{}).best||0);games[id]={...(games[id]||{}),best};saveProfile({games});

/* ---- 1. Balloon Pop ---- */
function gameBalloon(host,end){
  const A=Arena(host,.62,620);const hud=A.hud;hud.innerHTML=`<div class="q" id="bpQ"></div><div style="display:grid;gap:6px;justify-items:end"><div class="sc" id="bpS">0</div><div class="sc" id="bpT">60s</div><button class="chip" type="button" id="bpSay">Listen</button></div>`;
  let q=mathQ(),score=0,time=60,level=1,balloons=[],parts=[],spawnT=0,since=0,over=false,base=0;
  const clouds=[0,1,2,3,4].map(i=>({x:Math.random(),y:.08+i*.07,s:cloudSprite(160+i*30),v:.004+i*.002}));
  const hues=[0,28,48,130,200,265,320];
  const setQ=()=>{$("bpQ").textContent=q.text.replace("= ?","= ?")};setQ();$("bpSay").onclick=()=>speak(q.say,"en");
  function spawn(){const hasAns=balloons.some(b=>b.alive&&b.val===q.ans);const val=(!hasAns||since>=2)?q.ans:distract(q.ans,3)[randi(0,2)];since=val===q.ans?0:since+1;
    const r=Math.max(26,Math.min(44,A.W/20))*rand(.9,1.1);balloons.push({x:rand(r*1.3,A.W-r*1.3),y:A.H+r*1.5,r,vy:-(48+level*9+rand(0,18)),ph:rand(0,6),h:hues[randi(0,hues.length-1)],val,alive:true,shake:0})}
  function pop(b){b.alive=false;for(let i=0;i<16;i++){const a=rand(0,Math.PI*2),sp=rand(80,260);parts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:rand(3,7),c:`hsl(${b.h},85%,55%)`,rot:rand(0,6),vr:rand(-8,8),kind:"frag"})}
    for(let i=0;i<22;i++){const a=rand(0,Math.PI*2),sp=rand(60,220);parts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,life:1.3,r:rand(2,4),c:`hsl(${randi(0,360)},90%,60%)`,rot:0,vr:rand(-10,10),kind:"conf"})}
    parts.push({x:b.x,y:b.y,life:.35,r:b.r,kind:"ring"})}
  A.cv.addEventListener("pointerdown",e=>{if(over)return;SFX.init();const [mx,my]=A.pt(e);
    const hit=[...balloons].reverse().find(b=>b.alive&&((mx-b.x)/(b.r*1.1))**2+((my-b.y)/(b.r*1.2))**2<=1);if(!hit)return;
    if(hit.val===q.ans){pop(hit);SFX.pop();setTimeout(()=>SFX.ding(),90);score++;if(score%3===0)praise();if(score%5===0)level++;q=mathQ();setQ();$("bpS").textContent=score}
    else{hit.shake=1;SFX.buzz();time=Math.max(0,time-2)}});

      if(open.length===2){moves++;const [a,d]=open;if(a.key===d.key){a.el.classList.add("ok");d.el.classList.add("ok");found++;open=[];SFX.ding();speak(a.name+(a.hi?". "+a.hi:""),"en");
          if(found===pairs){const secs=Math.round((performance.now()-t0)/1000);setTimeout(()=>{celebrate(3);const sc=Math.max(1,pairs*10-Math.max(0,moves-pairs)*2);endMem(sc,`You matched all ${pairs} pairs in ${moves} moves and ${secs} seconds!`)},500)}}

  return()=>{wrap.remove()};
}

/* ---------- the growing Vidya Tree ---------- */
const SUBJ_COL={maths:"#2B77B8",science:"#2E7D4F",english:"#B83E64",hindi:"#E0A11B",sanskrit:"#7650B3",rigveda:"#D2691E"};
function learnedList(){const p=cur()||{};const tp=p.topics||{};const out=[];SUBJECTS.forEach(s=>pathFor(s.id).forEach(t=>{if((tp[t.id]||{}).stars>=2)out.push({s:s.id,t,at:tp[t.id].at||0})}));return out.sort((a,b)=>a.at-b.at)}
function drawTree(cv,{animate=true}={}){
  const W=cv.clientWidth||320,H=cv.clientHeight||260,d=Math.min(3,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;const x=cv.getContext("2d");x.setTransform(d,0,0,d,0,0);
  const learned=learnedList();const n=learned.length;const grow=Math.min(1,.62+n*.03);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const tips=[];
  function branch(x0,y0,len,ang,depth,w){const x1=x0+Math.cos(ang)*len,y1=y0+Math.sin(ang)*len;
    const g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,"#7A4E2D");g.addColorStop(1,"#94633C");x.strokeStyle=g;x.lineWidth=w;x.lineCap="round";
    x.beginPath();x.moveTo(x0,y0);x.quadraticCurveTo((x0+x1)/2+(rnd()-.5)*len*.25,(y0+y1)/2,x1,y1);x.stroke();
    if(depth===0){tips.push([x1,y1]);return}
    const k=2+(depth>2?1:0);for(let i=0;i<k;i++){branch(x1,y1,len*(.68+rnd()*.12),ang+(i-(k-1)/2)*(.5+rnd()*.25),depth-1,w*.68)}}
  x.clearRect(0,0,W,H);
  const gy=H-18;const hg=x.createRadialGradient(W/2,gy+30,10,W/2,gy+30,W*.6);hg.addColorStop(0,"#9CCC65");hg.addColorStop(1,"rgba(156,204,101,0)");x.fillStyle=hg;x.fillRect(0,gy-20,W,60);
  x.fillStyle="#7CB342";x.beginPath();x.ellipse(W/2,gy+6,W*.42,14,0,0,7);x.fill();
  branch(W/2,gy,H*.26*grow,-Math.PI/2,4,13*grow);
  /* canopy */
  const leafCols=["#43A047","#66BB6A","#2E7D32","#81C784"];
  tips.forEach(([tx,ty],i)=>{for(let j=0;j<5;j++){x.fillStyle=leafCols[(i+j)%4];x.globalAlpha=.9;x.beginPath();x.ellipse(tx+(rnd()-.5)*26*grow,ty+(rnd()-.5)*22*grow,(9+rnd()*7)*grow+3,(6+rnd()*5)*grow+2,rnd()*3,0,7);x.fill()}});x.globalAlpha=1;
  /* fruits = learned topics, coloured by subject */
  learned.slice(-tips.length*2).forEach((L,i)=>{const [tx,ty]=tips[(i*7)%tips.length];const ox=((i*37)%17-8),oy=((i*23)%13-4);const r=6+grow*2;
    const fg=x.createRadialGradient(tx+ox-r*.4,ty+oy-r*.4,1,tx+ox,ty+oy,r);fg.addColorStop(0,"#fff");fg.addColorStop(.25,SUBJ_COL[L.s]);fg.addColorStop(1,SUBJ_COL[L.s]);
    x.fillStyle=fg;x.beginPath();x.arc(tx+ox,ty+oy,r,0,7);x.fill()});
  if(n===0){x.fillStyle="rgba(0,0,0,.55)";x.font='700 13px Mukta, sans-serif';x.textAlign="center";x.fillText("Learn a topic to grow your first fruit!",W/2,22)}
}

/* offline quiz: pull checks from the lesson bank for a subject */
function offlineQuiz(subject,topicId,count){
  const ids=topicId?[topicId]:pathFor(subject).map(t=>t.id);let qs=[];
  ids.forEach(id=>{const L=OFFLINE_LESSONS[id];if(L)L.cards.forEach(c=>{if(c.check&&c.check.options.length>1&&c.visual.type!=="svg"&&!/this (clock|shape)|Is this cut/i.test(c.say))qs.push({q:(c.check.q||c.say)+(c.visual.type==="big"&&c.visual.text.length<40?"  "+c.visual.text.replace(/\n/g," "):""),options:c.check.options,answer:c.check.answer,explain:c.check.yes,topic:id})})});
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
  return qs.slice(0,count||5);
}

function genericScaffold(task){return {steps:["Listen to the task again 👂","Draw the main thing big, in the middle","Add words or numbers, then colour it"],look:["I did what the task asked","I added words, labels or numbers","I used colours"],ex:null}}
function scaffoldFor(t,aiScaf,task){
  if(aiScaf&&(aiScaf.steps||aiScaf.look_for||aiScaf.example)){let ex=null;if(aiScaf.example&&aiScaf.example.svg){const n=cleanSVG(aiScaf.example.svg);if(n)ex=n.outerHTML}
    return {steps:(aiScaf.steps||[]).slice(0,4).map(String),look:(aiScaf.look_for||[]).slice(0,4).map(String),ex:ex||(SCAFFOLD[t.id]||{}).ex||null}}
  return SCAFFOLD[t.id]||genericScaffold(task)}

function shrink(file){return new Promise((res,rej)=>{const im=new Image();const u=URL.createObjectURL(file);im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.86)};im.onerror=rej;im.src=u})}

/* ================= iPAD APP MODE (no Claude runtime) =================
   Local database in localStorage, drawings/photos in IndexedDB (served by the service worker at ./_blob/<id>),
   offline lessons from OFFLINE_LESSONS, self-checked work, and a button to open the live Claude version. */
const LocalDB=(()=>{
  const KEY="vt.db";let data={};try{data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){data={}}
  const subs=new Set();
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("The iPad storage is full. Delete some saved drawings in Grown-ups.")}};
  const parent=p=>p.slice(0,p.lastIndexOf("/"));
  const notify=path=>{const col=parent(path);setTimeout(()=>subs.forEach(s=>{if(s.col===col)s.fire()}),0)};
  const snap=d=>({id:d.id,exists:!!d.v,data:()=>d.v?JSON.parse(JSON.stringify(d.v)):undefined,metadata:{hasPendingWrites:false}});
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function query(col,ord,lim){
    let docs=Object.keys(data).filter(k=>parent(k)===col).map(k=>({id:k.slice(col.length+1),v:data[k]}));
    if(ord){const [f,dir]=ord;docs.sort((a,b)=>((a.v[f]??0)>(b.v[f]??0)?1:(a.v[f]??0)<(b.v[f]??0)?-1:0)*(dir==="desc"?-1:1))}
    if(lim)docs=docs.slice(0,lim);return {docs:docs.map(snap),size:docs.length,empty:!docs.length};
  }
  function collection(col){
    const q={_o:null,_l:0,
      orderBy(f,dir){const n=Object.create(q);n._o=[f,dir||"asc"];return n},
      limit(n){const m=Object.create(this);m._l=n;return m},
      async get(){return query(col,this._o,this._l)},
      onSnapshot(cb){const self=this;const s={col,fire:()=>{try{cb(query(col,self._o,self._l))}catch(e){console.error(e)}}};subs.add(s);setTimeout(s.fire,0);return ()=>subs.delete(s)},
      async add(v){const id=newId();data[col+"/"+id]=JSON.parse(JSON.stringify(v));persist();notify(col+"/"+id);return {id}}};
    return q;
  }
  function doc(path){return {
    async get(){return snap({id:path.split("/").pop(),v:data[path]})},
    async set(v){data[path]=JSON.parse(JSON.stringify(v));persist();notify(path)},
    async update(v){data[path]={...(data[path]||{}),...JSON.parse(JSON.stringify(v))};persist();notify(path)},
    async delete(){delete data[path];persist();notify(path)}}}
  return {collection,doc,dump:()=>JSON.parse(JSON.stringify(data)),load:o=>{data=o||{};persist();subs.forEach(s=>s.fire())}};
})();

/* drawings and family photos → IndexedDB */
const LocalAssets=(()=>{
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open("vidya-blobs",1);r.onupgradeneeded=()=>r.result.createObjectStore("b");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction("b",mode);const out=fn(t.objectStore("b"));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})};
  return {
    async upload(blob,o){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);await tx("readwrite",s=>s.put({type:(o&&o.type)||blob.type,blob},id));return {id}},
    async remove(id){await tx("readwrite",s=>s.delete(id))},
    async all(){const db=await open();return new Promise(res=>{const out=[];const c=db.transaction("b").objectStore("b").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)}})},
    async put(id,v){await tx("readwrite",s=>s.put(v,id))}};
})();

/* backup / restore so progress survives a new iPad */
async function exportBackup(){
  const blobs=[];for(const [k,v] of await LocalAssets.all()){const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(v.blob)});blobs.push([k,v.type,url])}
  const file=new Blob([JSON.stringify({app:"vidya-tree",v:1,date:Date.now(),db:LocalDB.dump(),blobs})],{type:"application/json"});
  const name=`vidya-tree-backup-${today()}.json`;
  try{if(navigator.canShare&&navigator.canShare({files:[new File([file],name,{type:"application/json"})]})){await navigator.share({files:[new File([file],name,{type:"application/json"})],title:"Vidya Tree backup"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();toast("Backup saved");
}
async function importBackup(f){try{const o=JSON.parse(await f.text());if(o.app!=="vidya-tree")throw 0;
    for(const [k,type,url] of o.blobs||[]){const blob=await (await fetch(url)).blob();await LocalAssets.put(k,{type,blob})}
    LocalDB.load(o.db);toast("Progress restored!")}catch(e){toast("That file isn't a Vidya Tree backup.")}}
